# SPDX-License-Identifier: BSD-2-Clause-Patent
name: Linux Redfish emulator
on:
  workflow_dispatch:
  push:
    branches: [main, linux/emulator-support]
    paths: ['Tools/LinuxEmulator/**', 'Tools/Redfish-Profile-Simulator/**', 'RedfishClientPkg/**', '.github/workflows/linux-emulator.yml']
  pull_request:
    paths: ['Tools/LinuxEmulator/**', 'Tools/Redfish-Profile-Simulator/**', 'RedfishClientPkg/**', '.github/workflows/linux-emulator.yml']
permissions:
  contents: read
jobs:
  simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Tools/Redfish-Profile-Simulator/requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s Tools/Redfish-Profile-Simulator/tests -v
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git uuid-dev nasm python3-venv pkg-config libx11-dev libxext-dev libslirp-dev libglib2.0-dev
          python3 -m venv .venv
          .venv/bin/pip install -r Tools/Redfish-Profile-Simulator/requirements.txt
      - name: Test tooling
        run: python3 -m unittest discover -s Tools/LinuxEmulator/tests -v
      - name: Fetch pinned firmware dependencies
        run: python3 Tools/LinuxEmulator/bootstrap.py .linux-emulator
      - name: Test native Linux SNP backend
        run: bash Tools/LinuxEmulator/Host/test.sh .linux-emulator/edk2
      - name: Build complete UEFI firmware
        run: Tools/LinuxEmulator/build.sh .linux-emulator/edk2 2 > build.log 2>&1
      - name: Run firmware against local mock
        run: .venv/bin/python Tools/LinuxEmulator/run.py .linux-emulator/edk2 --smoke --output smoke-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-emulator-logs
          path: |
            build.log
            smoke-results/*.log
            smoke-results/*.json
